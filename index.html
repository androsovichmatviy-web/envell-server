<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Энвелл — онлайн</title>
<style>
:root{--ink:#e9f2ff;--dim:#7f9bc4;--gold:#ffc83d;--panel:#101a2e;--line:#22365c}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none}
body{background:#05080f;color:var(--ink);min-height:100vh;display:flex;justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
#app{width:100%;max-width:560px;padding:8px 8px 26px}
.screen{display:none}.screen.on{display:block}

#boot{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.8;color:#7dffb0;
  background:#02050a;border:1px solid #13301f;border-radius:8px;padding:14px;min-height:380px}
#bar{height:8px;background:#0c2216;border:1px solid #1d4b31;margin-top:12px;display:none}
#bar i{display:block;height:100%;width:0;background:#3ddb85;transition:width .16s linear}

h1{font-size:30px;font-weight:900;color:var(--gold);text-align:center;letter-spacing:2px;line-height:1;
  text-shadow:2px 2px 0 #5b3208,4px 4px 0 #2a1604}
h1 em{display:block;font-style:normal;font-size:38px;color:#ffe487}
.sub{text-align:center;font-size:10px;color:var(--dim);letter-spacing:3px;margin:8px 0 16px}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:14px}
h2{font-size:16px;margin-bottom:4px}
.lead{font-size:12.5px;color:var(--dim);line-height:1.5;margin-bottom:12px}
label{font-size:11.5px;color:var(--dim);display:block;margin-bottom:4px}
input,select{width:100%;padding:9px;background:#0b1424;border:2px solid var(--line);border-radius:7px;
  color:var(--ink);font:inherit;font-size:14px;margin-bottom:10px}
.btn{width:100%;padding:12px;border:none;border-radius:8px;background:var(--gold);color:#2a1a00;
  font:inherit;font-size:14px;font-weight:800;letter-spacing:.5px;cursor:pointer;margin-top:4px}
.btn.sec{background:transparent;border:2px solid var(--line);color:var(--ink);font-weight:600}
.btn:disabled{opacity:.4}
.two{display:flex;gap:8px}.two>*{flex:1}

/* ---- капсулы выбора ---- */
#pods{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:4px 0 12px}
.pod{background:linear-gradient(#1a2a1c,#0d1a12);border:2px solid #3c5a3e;border-radius:6px;
  padding:4px 2px 5px;text-align:center;cursor:pointer;position:relative;overflow:hidden}
.pod .pnum{font:700 9px ui-monospace,monospace;color:#ffb340;letter-spacing:1px}
.pod canvas{display:block;margin:2px auto;image-rendering:pixelated}
.pod .pn{font-size:10px;font-weight:800}
.pod .pw{font-size:8px;color:#7f9bc4;white-space:nowrap;overflow:hidden}
.pod.mine{border-color:var(--gold);background:linear-gradient(#3a3418,#1d1a0a)}
.pod.busy{opacity:.45}

#hud{display:flex;gap:8px;align-items:center;font-size:12px;margin-bottom:6px}
#hud .lv{font-weight:800;font-size:14px}
#hud .en{color:var(--dim)}
#hud .pg{margin-left:auto;font-family:ui-monospace,monospace;font-size:10px;color:#6ef0a8}
canvas#cv{width:100%;height:auto;display:block;image-rendering:pixelated;
  border:2px solid #2b4a6e;border-radius:6px;background:#0b1a26;touch-action:none}

#roster{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px}
.rc{background:#0b1424;border:2px solid var(--line);border-radius:6px;padding:3px 2px;text-align:center}
.rc canvas{display:block;margin:0 auto;image-rendering:pixelated}
.rc .n{font-size:9px;font-weight:800;white-space:nowrap;overflow:hidden}
.rc .w{font-size:7.5px;color:var(--dim)}
.rc .b{height:4px;background:#2a1a1a;margin-top:2px;overflow:hidden}
.rc .b i{display:block;height:100%;background:#e8433f}
.rc .e{height:3px;background:#2a2410;margin-top:1px;overflow:hidden}
.rc .e i{display:block;height:100%;background:var(--gold)}
.rc.down{opacity:.35}

#pad{display:flex;gap:6px;margin-top:8px}
#pad button{flex:1;padding:15px 4px;background:#14243c;border:2px solid #2f4d78;border-radius:9px;
  color:var(--ink);font:inherit;font-size:13px;font-weight:800;cursor:pointer;position:relative;overflow:hidden}
#pad button:active,#pad button.hold{background:#25406b}
#pad .fill{position:absolute;left:0;bottom:0;width:100%;background:rgba(255,200,61,.25)}
#pad span{position:relative}
#chatBox{margin-top:6px;height:44px;overflow:hidden;font-size:11.5px;line-height:1.5;color:var(--dim)}
#chatBox b{color:#fff}
.tip{margin-top:6px;font-size:11px;color:#55699a;line-height:1.45}
</style>
</head>
<body><div id="app">

<section class="screen on" id="boot"><div id="bootLines"></div><div id="bar"><i></i></div></section>

<section class="screen" id="join">
  <h1>ГЕРОИ<em>ЭНВЕЛЛА</em></h1>
  <div class="sub">ОНЛАЙН · ДО 5 ИГРОКОВ · 100 УРОВНЕЙ</div>
  <div class="panel">
    <label>Твоё имя</label><input id="nick" maxlength="14" placeholder="Игрок">
    <label>Код комнаты (одинаковый у всех)</label><input id="room" maxlength="12" value="ENVELL">
    <button class="btn" id="bJoin">Войти в комнату</button>
    <p class="tip">Друзья открывают эту же ссылку и вводят тот же код.</p>
  </div>
</section>

<section class="screen" id="lobby">
  <div class="panel">
    <h2>Комната <span id="rc"></span></h2>
    <p class="lead">Выбери капсулу. Свободные займут боты.</p>
    <div id="pods"></div>
    <div class="two">
      <div><label>Уровень</label><input type="number" id="lv" min="1" max="100" value="1"></div>
      <div><label>Сложность</label><select id="df">
        <option value="0.75">Лёгкая</option><option value="1" selected>Обычная</option><option value="1.4">Хардкор</option>
      </select></div>
    </div>
    <button class="btn" id="bGo" disabled>Сначала выбери героя</button>
    <button class="btn sec" id="bOut">Выйти</button>
    <div id="chatBox"></div>
  </div>
</section>

<section class="screen" id="game">
  <div id="hud"><span class="lv" id="hLv">Уровень 1</span><span class="en" id="hEn"></span><span class="pg" id="hPg">— мс</span></div>
  <canvas id="cv" width="320" height="180"></canvas>
  <div id="roster"></div>
  <div id="pad">
    <button id="bL"><span>◀</span></button>
    <button id="bR"><span>▶</span></button>
    <button id="bJ"><span>ПРЫЖОК</span></button>
    <button id="bA"><i class="fill"></i><span id="abT">Удар</span></button>
  </div>
  <div id="chatBox2"></div>
  <input id="chatIn" maxlength="80" placeholder="написать команде…">
  <p class="tip">Клавиши: A/D — идти, Пробел — прыжок, E — способность. Атака автоматическая.</p>
</section>

</div>
<script>
"use strict";
var $=function(i){return document.getElementById(i)};
function show(s){['boot','join','lobby','game'].forEach(function(x){$(x).classList.toggle('on',x===s)})}

/* ======== загрузка ======== */
var BOOT=["ENVELL BIOS  v2.17","Проверка памяти ....... 4096 MB  OK","Накопитель ............ ENVELL-DISK  OK",
"Видеоядро ............. OK","","Загрузка ядра...","Сетевой адаптер: найден","","> запуск: ГЕРОИ ЭНВЕЛЛА"];
var bi=0;
(function step(){
  if(bi<BOOT.length){var s=document.createElement('div');s.textContent=BOOT[bi]||"\u00a0";
    $('bootLines').appendChild(s);bi++;setTimeout(step,BOOT[bi-1]===""?80:190);}
  else{$('bar').style.display='block';var p=0,el=$('bar').firstElementChild;
    var t=setInterval(function(){p+=7+Math.random()*11;
      if(p>=100){p=100;clearInterval(t);setTimeout(function(){show('join')},350);}
      el.style.width=p+'%';},60);}
})();

/* ======== пиксель-спрайты ========
   1 контур  2 кожа  3 волосы  4 одежда  5 акцент  6 глаз  7 блик */
var HERO=[
"...333333...",
"..33333333..",
".3333333333.",
"..32222223..",
"..32622623..",
"..32222223..",
"...322223...",
"....2222....",
"..44444444..",
".4444554444.",
".2444554442.",
"..44555544..",
"..44444444..",
"..444..444..",
"..444..444..",
"..111..111.."];

var PAL={
 art :{1:'#241522',2:'#f3c79c',3:'#ff6a3d',4:'#b93a2e',5:'#ffd166',6:'#241522'},
 kira:{1:'#1a1430',2:'#f3c79c',3:'#a259ff',4:'#3b2a63',5:'#c9a6ff',6:'#1a1430'},
 vik :{1:'#0f1f33',2:'#f3c79c',3:'#3f8de0',4:'#27456f',5:'#9fd4ff',6:'#0f1f33'},
 fil :{1:'#0f2a1f',2:'#f3c79c',3:'#3ac07a',4:'#235c42',5:'#8dffc0',6:'#0f2a1f'},
 lars:{1:'#2b2110',2:'#f3c79c',3:'#e8b93a',4:'#6b5426',5:'#ffe08a',6:'#2b2110'}
};

var BUG=["...111...","..11111..",".1122111.","111111111",".1111111.","..1.1.1..",".1..1..1."];
var FLY=["....111....","...11111...","..1122211..",".111111111.","11111111111",".111111111.","..1111111..","...3.3.3..."];
var GOL=["..11111111..",".1111111111.",".1133113311.",".1111111111.","111111111111","111122221111","111122221111","111111111111",".1111111111.",".1111111111.",".111....111.",".111....111."];
var BOSS=["..1........1..","..11......11..","..111....111..","...11111111...","..1111111111..","..1133113311..","..1111111111..","...11111111...",".111111111111.","11111122111111","11111122111111",".111111111111.","..1111111111..","..111....111..","..111....111..","..111....111.."];

var FPAL={
 bug  :{1:'#e8433f',2:'#ffd166',3:'#ffd166'},
 flyer:{1:'#ff8a3d',2:'#2b1408',3:'#ffe08a'},
 golem:{1:'#7d5cc9',2:'#c9a6ff',3:'#2a1040'},
 guard:{1:'#e8433f',2:'#ffd166',3:'#2a1040'},
 boss1:{1:'#7a2ec0',2:'#ffd166',3:'#ffe066'},
 boss2:{1:'#bd2a8f',2:'#ffd166',3:'#fff0a0'},
 boss3:{1:'#ff2e5e',2:'#fff0a0',3:'#ffffff'}
};

var cache={};
function sprite(grid,pal,key){
  if(cache[key]) return cache[key];
  var w=grid[0].length,h=grid.length;
  var c=document.createElement('canvas');c.width=w;c.height=h;
  var g=c.getContext('2d');
  for(var y=0;y<h;y++) for(var x=0;x<w;x++){
    var ch=grid[y][x]; if(ch==='.') continue;
    g.fillStyle=pal[ch]||'#fff'; g.fillRect(x,y,1,1);
  }
  cache[key]=c; return c;
}
function blit(ctx,img,x,y,flip,sc){
  sc=sc||1;
  ctx.save();
  if(flip<0){ ctx.translate(Math.round(x+img.width*sc),Math.round(y)); ctx.scale(-1,1); }
  else ctx.translate(Math.round(x),Math.round(y));
  ctx.drawImage(img,0,0,img.width*sc,img.height*sc);
  ctx.restore();
}
function heroSpr(k){ return sprite(HERO,PAL[k],'h'+k); }
function faceSpr(k){
  var key='f'+k; if(cache[key]) return cache[key];
  var src=heroSpr(k);
  var c=document.createElement('canvas');c.width=12;c.height=8;
  c.getContext('2d').drawImage(src,0,0,12,8,0,0,12,8);
  cache[key]=c; return c;
}

/* ======== сеть ======== */
var ws=null,ME=0,CL={},ORD=[],W=320,H=180,FLOOR=168,myCls=null;
var cur=null,prev=null,curT=0,prevT=0,lastP=0,ping=0;

$('bJoin').onclick=function(){
  var n=($('nick').value||'Игрок').trim().slice(0,14);
  var r=($('room').value||'ENVELL').trim().toUpperCase().slice(0,12);
  var pr=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(pr+'://'+location.host+'/?room='+encodeURIComponent(r)+'&name='+encodeURIComponent(n));
  ws.onmessage=onMsg;
  ws.onclose=function(){ addChat('Сервер','Соединение закрыто.'); show('join'); };
  ws.onerror=function(){ addChat('Сервер','Не удалось подключиться.'); };
};
function send(o){ if(ws&&ws.readyState===1) ws.send(JSON.stringify(o)); }

function onMsg(ev){
  var m=JSON.parse(ev.data);
  if(m.t==='hello'){ ME=m.id;CL=m.classes;ORD=m.order;W=m.W;H=m.H;FLOOR=m.floor;show('lobby'); }
  else if(m.t==='full'){ alert('В комнате уже 5 игроков. Выберите другой код.'); }
  else if(m.t==='lobby'){ drawPods(m); }
  else if(m.t==='chat'){ addChat(m.who,m.text); }
  else if(m.t==='s'){
    prev=cur;prevT=curT;cur=m;curT=performance.now();
    ping=Math.round(curT-lastP);lastP=curT;
    if(m.ph!=='lobby'&&m.ph!=='won'&&myCls&&!$('game').classList.contains('on')) show('game');
    hud(m);
  }
}
function drawPods(m){
  $('rc').textContent=m.code;
  var box=$('pods');box.innerHTML='';
  m.slots.forEach(function(s,i){
    var d=document.createElement('div');
    d.className='pod'+(myCls===s.key?' mine':'')+((s.taken&&myCls!==s.key)?' busy':'');
    var cv=document.createElement('canvas');cv.width=36;cv.height=48;
    var g=cv.getContext('2d');g.imageSmoothingEnabled=false;
    g.drawImage(heroSpr(s.key),0,0,36,48);
    d.innerHTML='<div class="pnum">P'+(i+1)+'</div>';
    d.appendChild(cv);
    var t=document.createElement('div');
    t.innerHTML='<div class="pn" style="color:'+PAL[s.key][3]+'">'+s.name+'</div><div class="pw">'+(s.taken?s.by:s.ab)+'</div>';
    d.appendChild(t);
    d.onclick=function(){ if(s.taken&&myCls!==s.key) return;
      myCls=s.key;send({t:'pick',cls:s.key});
      $('bGo').disabled=false;$('bGo').textContent='В бой';
      $('abT').textContent=CL[s.key]?CL[s.key].ab:'Способность'; };
    box.appendChild(d);
  });
  if(m.phase==='play'&&myCls) show('game');
}
$('bGo').onclick=function(){ send({t:'start',level:parseInt($('lv').value,10)||1,diff:parseFloat($('df').value)}); };
$('bOut').onclick=function(){ if(ws) ws.close(); show('join'); };
$('chatIn').onkeydown=function(e){ if(e.key==='Enter'&&this.value.trim()){ send({t:'chat',text:this.value.trim()});this.value=''; } };

function esc(s){ return String(s).replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c]}); }
function addChat(who,text){
  var col='#fff';
  for(var k in CL) if(CL[k].name===who&&PAL[k]) col=PAL[k][3];
  ['chatBox','chatBox2'].forEach(function(id){
    var c=$(id);if(!c)return;
    var d=document.createElement('div');
    d.innerHTML='<b style="color:'+col+'">'+esc(who)+':</b> '+esc(text);
    c.appendChild(d);while(c.children.length>3)c.removeChild(c.firstChild);
  });
}

/* ======== ввод ======== */
var keys={},holdL=false,holdR=false,jumpF=false,abF=false;
addEventListener('keydown',function(e){
  if(document.activeElement===$('chatIn'))return;
  var k=e.key.toLowerCase();keys[k]=true;
  if(k===' '||k==='w'||k==='arrowup'){e.preventDefault();jumpF=true;}
  if(k==='e')abF=true;
  if(k==='arrowleft'||k==='arrowright')e.preventDefault();
});
addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false;});
function holdBtn(el,on,off){
  ['touchstart','mousedown'].forEach(function(t){el.addEventListener(t,function(e){e.preventDefault();el.classList.add('hold');on();},{passive:false});});
  ['touchend','touchcancel','mouseup','mouseleave'].forEach(function(t){el.addEventListener(t,function(){el.classList.remove('hold');off&&off();});});
}
holdBtn($('bL'),function(){holdL=true;},function(){holdL=false;});
holdBtn($('bR'),function(){holdR=true;},function(){holdR=false;});
holdBtn($('bJ'),function(){jumpF=true;});
holdBtn($('bA'),function(){abF=true;});

setInterval(function(){
  var dx=0;
  if(holdL||keys['a']||keys['arrowleft'])dx-=1;
  if(holdR||keys['d']||keys['arrowright'])dx+=1;
  send({t:'in',dx:dx,j:jumpF,a:abF});
  jumpF=false;abF=false;
},50);

/* ======== HUD ======== */
function hud(m){
  $('hLv').textContent='Уровень '+m.lv+(m.lv>=100?' — МОРГАРТ':'');
  $('hEn').textContent=m.ph==='clear'?('следующий через '+m.tm+'с')
    :m.ph==='dead'?('перезапуск '+m.tm+'с'):(m.en<0?'босс':'врагов: '+m.en);
  $('hPg').textContent=ping+' мс';
  var r=$('roster');
  if(r.children.length!==m.h.length){
    r.innerHTML='';
    m.h.forEach(function(h){
      var c=document.createElement('div');c.className='rc';
      var cv=document.createElement('canvas');cv.width=24;cv.height=16;
      var g=cv.getContext('2d');g.imageSmoothingEnabled=false;
      g.drawImage(faceSpr(h.k),0,0,24,16);
      c.appendChild(cv);
      var d=document.createElement('div');
      d.innerHTML='<div class="n" style="color:'+PAL[h.k][3]+'">'+CL[h.k].name+'</div>'+
        '<div class="w"></div><div class="b"><i></i></div><div class="e"><i></i></div>';
      c.appendChild(d);r.appendChild(c);
    });
  }
  m.h.forEach(function(h,i){
    var el=r.children[i];if(!el)return;
    el.classList.toggle('down',!!h.dn);
    el.querySelector('.b i').style.width=Math.max(0,h.hp/h.mx*100)+'%';
    var c=CL[h.k];
    el.querySelector('.e i').style.width=(h.ab>0?100-h.ab/c.abcd*100:100)+'%';
    el.querySelector('.w').textContent=h.o===ME?'ты':(h.o?'игрок':'бот');
  });
  var me=m.h.find(function(h){return h.o===ME;});
  if(me){var c=CL[me.k];
    $('bA').firstElementChild.style.height=(me.ab>0?me.ab/c.abcd*100:0)+'%';
    $('abT').textContent=me.ab>0?Math.ceil(me.ab/60)+'с':c.ab;}
}

/* ======== отрисовка ======== */
var cv=$('cv'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
var eff=[],camShake=0;

var ISLES=[[24,42,26,9],[212,32,34,11],[130,58,20,7],[276,64,22,8],[70,70,16,6]];

function bg(boss){
  var bands=boss?['#140a1c','#1d0f2a','#2a1440','#3a1c52','#4a2266']
                :['#0f2a3d','#164257','#1d5a6e','#2b7a7e','#3f9a86'];
  for(var i=0;i<bands.length;i++){ ctx.fillStyle=bands[i]; ctx.fillRect(0,i*22,W,23); }
  ctx.fillStyle=boss?'#5a2a72':'#54b894'; ctx.fillRect(0,110,W,FLOOR-110);
  for(var j=0;j<ISLES.length;j++){
    var s=ISLES[j];
    ctx.fillStyle=boss?'#2a1038':'#1f3a4a'; ctx.fillRect(s[0],s[1],s[2],s[3]);
    ctx.fillRect(s[0]+3,s[1]+s[3],s[2]-6,3);
    ctx.fillRect(s[0]+6,s[1]+s[3]+3,s[2]-12,2);
    ctx.fillStyle=boss?'#6a2a8a':'#4fae72'; ctx.fillRect(s[0],s[1],s[2],2);
  }
  ctx.fillStyle=boss?'#1b0e26':'#123040'; ctx.fillRect(0,FLOOR,W,H-FLOOR);
  ctx.fillStyle=boss?'#7a2ec0':'#7ed957'; ctx.fillRect(0,FLOOR,W,2);
  ctx.fillStyle=boss?'#4a1878':'#4fae52';
  for(var x=0;x<W;x+=8) ctx.fillRect(x+(x/8%2?2:5),FLOOR+2,2,2);
}
function plat(p,boss){
  ctx.fillStyle=boss?'#2a1038':'#1f3a4a'; ctx.fillRect(p.x,p.y,p.w,6);
  ctx.fillStyle=boss?'#7a2ec0':'#7ed957'; ctx.fillRect(p.x,p.y,p.w,2);
  ctx.fillStyle=boss?'#1b0e26':'#14293a';
  for(var x=p.x+2;x<p.x+p.w-2;x+=6) ctx.fillRect(x,p.y+6,3,2);
}

function render(){
  requestAnimationFrame(render);
  if(!cur){return;}
  var a=prev?Math.min(1,(performance.now()-curT)/Math.max(16,curT-prevT)):1;
  var pf={},pp={},ph={};
  if(prev){ prev.f.forEach(function(o){pf[o.i]=o;}); prev.p.forEach(function(o){pp[o.i]=o;});
            prev.h.forEach(function(o){ph[o.k]=o;}); }
  if(cur.x&&cur.x.length){ cur.x.forEach(function(e){ eff.push({x:e.x,y:e.y,r:2,m:e.m,c:e.c,life:14});
    if(e.m>60) camShake=8; }); cur.x=[]; }

  var boss=cur.lv>=100;
  ctx.save();
  if(camShake>0){ camShake--; ctx.translate(((Math.random()*3)|0)-1,((Math.random()*3)|0)-1); }
  bg(boss);
  (cur.pl||[]).forEach(function(p){plat(p,boss);});

  cur.f.forEach(function(f){
    var o=pf[f.i],x=o?o.x+(f.x-o.x)*a:f.x,y=o?o.y+(f.y-o.y)*a:f.y;
    if(f.t==='bug')        blit(ctx,sprite(BUG,FPAL.bug,'e1'),x,y,f.f,1);
    else if(f.t==='flyer') blit(ctx,sprite(FLY,FPAL.flyer,'e2'),x,y,f.f,1);
    else if(f.t==='golem') blit(ctx,sprite(GOL,FPAL.golem,'e3'),x,y,f.f,1);
    else {
      blit(ctx,sprite(GOL,FPAL.guard,'e4'),x,y,f.f,19/12);
      ctx.fillStyle='#2a1a0a';ctx.fillRect(x,y-5,19,3);
      ctx.fillStyle='#ffd166';ctx.fillRect(x,y-5,Math.max(0,19*f.hp/f.mx),3);
    }
  });

  if(cur.b){
    var b=cur.b;
    blit(ctx,sprite(BOSS,FPAL['boss'+b.ph],'b'+b.ph),b.x,b.y,b.f,35/14);
    ctx.fillStyle='#140a14';ctx.fillRect(40,8,W-80,9);
    ctx.fillStyle='#ff2e5e';ctx.fillRect(42,10,(W-84)*Math.max(0,b.hp/b.mx),5);
    ctx.fillStyle='#ffe066';ctx.font='6px monospace';ctx.textAlign='center';
    ctx.fillText('МОРГАРТ  ФАЗА '+b.ph,W/2,25);
  }

  cur.p.forEach(function(s){
    var o=pp[s.i],x=o?o.x+(s.x-o.x)*a:s.x,y=o?o.y+(s.y-o.y)*a:s.y;
    ctx.fillStyle=s.c; ctx.fillRect(Math.round(x-s.r),Math.round(y-s.r),s.r*2,s.r*2);
  });

  cur.h.forEach(function(h){
    var o=ph[h.k],x=o?o.x+(h.x-o.x)*a:h.x,y=o?o.y+(h.y-o.y)*a:h.y;
    if(h.dn){
      ctx.globalAlpha=.3; blit(ctx,heroSpr(h.k),x,y+8,h.f,1); ctx.globalAlpha=1;
      ctx.fillStyle='#9fb4dd';ctx.font='6px monospace';ctx.textAlign='center';
      ctx.fillText(h.rt+'с',x+6,y+4);
      return;
    }
    if(h.sh){ ctx.strokeStyle='#9fd4ff';ctx.lineWidth=1;
      ctx.strokeRect(Math.round(x)-3.5,Math.round(y)-3.5,19,23); }
    blit(ctx,heroSpr(h.k),x,y,h.f,1);
    if(h.o===ME){ ctx.fillStyle='#ffd166'; ctx.fillRect(Math.round(x)+4,Math.round(y)-6,4,2);
      ctx.fillRect(Math.round(x)+5,Math.round(y)-4,2,2); }
    ctx.fillStyle='#2a1010';ctx.fillRect(Math.round(x),Math.round(y)-2,12,2);
    ctx.fillStyle=h.hp/h.mx>.35?'#5ddb8c':'#e8433f';
    ctx.fillRect(Math.round(x),Math.round(y)-2,Math.max(0,Math.round(12*h.hp/h.mx)),2);
  });

  for(var i=eff.length-1;i>=0;i--){
    var e=eff[i];e.life--;e.r+=(e.m/2-e.r)*0.3;
    ctx.globalAlpha=Math.max(0,e.life/14);
    ctx.strokeStyle=e.c;ctx.lineWidth=1;
    ctx.strokeRect(Math.round(e.x-e.r),Math.round(e.y-e.r),Math.round(e.r*2),Math.round(e.r*2));
    ctx.globalAlpha=1;
    if(e.life<=0)eff.splice(i,1);
  }
  ctx.restore();
}
render();
</script>
</body></html>
